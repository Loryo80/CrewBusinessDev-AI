# logging_config.ini

[loggers]
keys=root,crewFactory,reportManager,metrics

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=simpleFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler,fileHandler

[logger_crewFactory]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=crewFactory
propagate=0

[logger_reportManager]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=reportManager
propagate=0

[logger_metrics]
level=DEBUG
handlers=consoleHandler,fileHandler
qualname=metrics
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=simpleFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=DEBUG
formatter=simpleFormatter
args=('app.log', 'w')

[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s